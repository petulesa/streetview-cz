name: Aktualizace Prahy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Stáhnu repozitář
        uses: actions/checkout@v4

      - name: Nastavím Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nainstaluji knihovny
        run: |
          pip install streetlevel folium requests

      - name: Spustím aktualizaci Prahy
        run: |
          python update_praha.py

      - name: Uložím novou mapu Prahy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add praha_cast1.txt praha_cast2.txt praha.html

          git commit -m "Aktualizace mapy Prahy" || echo "Žádná změna"

          git push
