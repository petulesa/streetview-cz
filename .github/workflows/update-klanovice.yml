name: Aktualizace Klánovic

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  
permissions:
  contents: write
  
jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Stáhnu repozitář
        uses: actions/checkout@v4

      - name: Nastavím Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nainstaluji knihovny
        run: |
          pip install streetlevel folium requests

      - name: Spustím aktualizaci
        run: |
          python update_klanovice.py

      - name: Uložím novou mapu
        run: |
          date -u +"%Y-%m-%d %H:%M:%S UTC" > klanovice_last_update.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add klanovice_streetview_2024_2026.html klanovice_last_update.txt
          git commit -m "Automatická aktualizace Klánovic" || echo "Žádná změna"
          git push
